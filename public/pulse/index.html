<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Favicon als Data-URI, damit publish.mjs keine zweite Datei spiegeln muss.
     Gerundetes Quadrat mit ausgespartem Punkt, folgt prefers-color-scheme. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48c3R5bGU+LmJ7ZmlsbDojMTcxNjFhfS5ke2ZpbGw6I2ZmZn1AbWVkaWEocHJlZmVycy1jb2xvci1zY2hlbWU6ZGFyayl7LmJ7ZmlsbDojZmFmYWZhfS5ke2ZpbGw6IzBiMGIwY319PC9zdHlsZT48cmVjdCBjbGFzcz0iYiIgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOSIvPjxjaXJjbGUgY2xhc3M9ImQiIGN4PSIxNiIgY3k9IjE2IiByPSI2LjUiLz48L3N2Zz4=">
<title>PULSE</title>
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --line:#e6e5e1; --line2:#d3d2cc;
    --tx:#17161a; --tx2:#54535a; --tx3:#8a8991; --accent:#17161a; --accent-tx:#ffffff;
    --chip:#f1f0ee; --chip-hover:#e7e6e3;
    --hover:#ffffff; --hover-shadow:0 1px 2px rgba(23,22,26,.05), 0 10px 28px rgba(23,22,26,.08);
    --glass:rgba(255,255,255,.62); --glass-line:rgba(23,22,26,.09); --glass-hi:rgba(255,255,255,.8);
    --glass-shadow:0 1px 2px rgba(23,22,26,.05), 0 12px 32px rgba(23,22,26,.12);
    --ease:cubic-bezier(.2,.7,.2,1);
    --sans:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --footh:44px;
    --hbd:1.9s;   /* Herzschlag-Periode des Punkts, der Scroll beschleunigt sie */
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0c; --surface:#141416; --line:#242427; --line2:#34343a;
    --tx:#fafafa; --tx2:#a6a6ad; --tx3:#77767e; --accent:#fafafa; --accent-tx:#0b0b0c;
    --hover:#17171b; --hover-shadow:none;
    --glass:rgba(28,28,32,.58); --glass-line:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.07);
    --glass-shadow:0 12px 34px rgba(0,0,0,.5);
    --chip:#1c1c20; --chip-hover:#26262b;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:clamp(14px,3.9vw,15px);line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--tx);color:var(--bg);}
  /* Oben Platz fuer das schwebende Island, unten fuer den festen Fuss */
  .wrap{max-width:880px;margin:0 auto;padding:calc(72px + env(safe-area-inset-top,0px)) 22px calc(var(--footh) + 70px);}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------------------------------------------------------------------
     Island. Eine schwebende Glas-Pille oben mittig, die Logo, Themen-Schiene
     und Datums-Toast ersetzt. Ruhe: Punkt plus aktive Rubrik. Hover oder Tipp
     klappt eine senkrechte Rubrikenliste auf, darunter Sprache und Hell/Dunkel.
     Beim Tageswechsel schlaegt der Punkt hart und die Pille weitet sich zum
     Datum, danach zieht sie sich auf die Rubrik zurueck.
     Die Breite wird vom Skript als Pixelwert gefuehrt, weil sich auto nicht
     animieren laesst (siehe morph()). Die Breite wird bewusst animiert statt
     ueber transform: ein einzelnes fixiertes Element ausserhalb des Flusses,
     contain:layout haelt den Umbau im Island, und scaleX wuerde Text und
     Radien verzerren. overflow:hidden beschneidet die Form waehrend des Umbaus,
     deshalb sitzt der Fokusring innen.
     --------------------------------------------------------------------- */
  .island{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;
          max-width:calc(100vw - 32px);contain:layout;
          background:var(--glass);border:1px solid var(--glass-line);
          -webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);
          box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-shadow);
          border-radius:999px;overflow:hidden;
          transition:width .4s var(--ease),border-radius .4s var(--ease);}
  .island.open{border-radius:22px;}
  .is-head{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--tx);
           font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;
           line-height:1;padding:11px 16px 11px 12px;cursor:pointer;white-space:nowrap;text-align:left;
           transition:opacity .2s ease .1s,visibility 0s;}
  .is-head:focus-visible{outline:2px solid var(--tx);outline-offset:-4px;border-radius:999px;}
  /* Offen verschwindet der Kopf mit Punkt und PULSE, das Menue steht fuer sich.
     Die Hoehe faellt ueber die Rasterzeile auf null (0fr), der innere Rahmen
     beschneidet den Knopf samt Innenabstand. Daniel, 08.10.2026. */
  .is-headwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s var(--ease);}
  .is-headin{min-height:0;overflow:hidden;}
  .island.open .is-headwrap{grid-template-rows:0fr;}
  .island.open .is-head{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .12s ease,visibility 0s linear .32s;}
  .island.open .is-list{padding-top:6px;}
  /* Der Punkt ist das Logo. Doppelschlag wie ein Herz, Periode ueber --hbd. */
  .is-dot{width:8px;height:8px;border-radius:50%;background:var(--tx);flex:none;transform-origin:center;
          animation:hb var(--hbd) ease-in-out infinite;}
  /* Harter Schlag beim Tageswechsel: schnell gross, dann weich zurueck. Kein
     Ueberschwingen im Easing, die Spitze sitzt im Keyframe selbst. */
  .is-dot.beat{animation:beat .64s cubic-bezier(.16,1,.3,1);}
  @keyframes hb{0%,100%{transform:scale(.68);opacity:.5} 15%{transform:scale(1);opacity:1} 29%{transform:scale(.8);opacity:.78} 43%{transform:scale(1);opacity:1} 62%{transform:scale(.68);opacity:.5}}
  @keyframes beat{0%{transform:scale(.8);opacity:.8} 26%{transform:scale(1.85);opacity:1} 100%{transform:scale(.68);opacity:.5}}
  .is-lbl{display:inline-flex;align-items:center;min-height:11px;}
  /* Ruhelabel PULSE etwas breiter gesetzt: der Name wohnt jetzt hier, nicht mehr im Logo. */
  .island.brand .is-lbl{letter-spacing:0.16em;font-weight:600;}
  /* Datum als Split-Flap: jede Stelle ein eigenes Blatt mit fester Laufweite,
     sonst zappelt die Pille waehrend des Durchrollens. Blattbreite gemessen am M. */
  .is-lbl .ch{display:inline-block;width:.84em;text-align:center;letter-spacing:0;transform-origin:50% 60%;backface-visibility:hidden;}
  .is-lbl .ch.sp{width:.42em;}
  .is-lbl .ch.roll{animation:chroll .085s linear;}
  @keyframes chroll{from{transform:rotateX(-62deg);opacity:.4;} to{transform:rotateX(0);opacity:1;}}

  /* Menue: Hoehe ueber die Rasterzeile animiert (0fr zu 1fr), Breite ueber das Island.
     Zugeklappt hat das Menue keine Breite, damit die Pille nur so breit ist wie der Kopf. */
  .is-menu{display:grid;grid-template-rows:0fr;width:0;opacity:0;visibility:hidden;
           transition:grid-template-rows .4s var(--ease),opacity .18s ease,visibility 0s linear .4s;}
  .island.open .is-menu{grid-template-rows:1fr;width:min(300px,calc(100vw - 32px));opacity:1;visibility:visible;
           transition:grid-template-rows .44s var(--ease),opacity .3s ease .08s,visibility 0s;}
  .is-in{min-height:0;overflow:hidden;}
  .is-list{display:flex;flex-direction:column;padding:0 6px 6px;}
  .is-item{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--tx2);
           font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:0;text-align:left;
           padding:10px 12px;border-radius:13px;cursor:pointer;white-space:nowrap;
           transition:background-color .16s ease,color .16s ease;}
  .is-item:hover{background:var(--chip);color:var(--tx);}
  .is-item:focus-visible{outline:2px solid var(--tx);outline-offset:-2px;}
  .is-item[aria-checked="true"]{color:var(--tx);font-weight:600;}
  .is-item i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0;flex:none;transition:opacity .16s ease,transform .25s var(--ease);transform:scale(.6);}
  .is-item[aria-checked="true"] i{opacity:1;transform:scale(1);}
  .is-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 6px;padding:9px 6px 8px;border-top:1px solid var(--glass-line);}
  .langsw{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;}
  .langsw button{font-family:var(--sans);font-size:11.5px;letter-spacing:0.05em;background:none;border:none;color:var(--tx2);padding:6px 11px;cursor:pointer;transition:background-color .22s ease,color .22s ease;}
  .langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-tx);}
  .langsw button:focus-visible{outline:2px solid var(--tx);outline-offset:-3px;}
  .is-theme{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:999px;
            background:none;border:1px solid var(--line2);color:var(--tx2);cursor:pointer;transition:border-color .2s ease,color .2s ease;}
  .is-theme:hover{border-color:var(--tx3);color:var(--tx);}
  .is-theme:focus-visible{outline:2px solid var(--tx);outline-offset:-3px;}
  .is-theme svg{width:15px;height:15px;}

  /* Timeline: keine Trennstriche, Rhythmus ueber Weissraum. Kein Datum im Strom,
     das traegt das Island beim Tageswechsel. Der Wechsel zeigt sich ueber den
     groesseren Abstand. */
  .day{padding:0;}
  .day + .day{padding-top:44px;}
  /* Innenabstand rundum gleich. Der Abstand zwischen Schlagzeile und Einordnung sitzt
     im aufklappenden Teil, sonst bleibt er zugeklappt unten stehen und der Eintrag
     wirkt unten luftiger als oben. */
  .entry{padding:20px;margin:0 -20px 16px;border-radius:24px;cursor:pointer;
         transition:background-color .24s ease,box-shadow .28s ease,
                    opacity .55s ease var(--rd,0ms),transform .6s var(--ease) var(--rd,0ms);}
  .entry:hover{background:var(--hover);box-shadow:var(--hover-shadow);}
  /* Einblenden beim Hereinscrollen, einmal pro Eintrag, leicht von unten */
  .entry.pre{opacity:0;transform:translateY(14px);}
  /* Overline: Rubrik, dann die Leitquelle. Bei Personen ein Glyph vor dem Autor,
     Portale ohne. Ab zwei Quellen eine Zaehlpille. Kontrast ueber 7:1, weil die
     Zeile jetzt Information traegt und nicht nur ein Etikett ist. */
  .entry .meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 7px;font-family:var(--sans);font-size:10.5px;font-weight:500;
               letter-spacing:0.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:9px;transition:opacity .35s ease;}
  .entry .meta .sep{color:var(--line2);font-weight:400;}
  .entry .meta .src{display:inline-flex;align-items:center;gap:5px;min-width:0;}
  .entry .meta .src svg{width:10px;height:10px;flex:none;}
  .entry .meta .more{font-size:9.5px;letter-spacing:0.02em;line-height:1.5;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--tx2);}
  .entry h3{margin:0;font-size:clamp(16.5px,4.6vw,19px);font-weight:600;line-height:1.34;letter-spacing:-0.005em;text-wrap:balance;
            transition:color .35s ease,font-weight .35s ease;}
  .entry .head{cursor:pointer;display:block;}
  .entry .head:focus-visible{outline:2px solid var(--tx);outline-offset:4px;border-radius:6px;}
  /* Aufklappen ueber die Zeilenhoehe des Rasters: 0fr zu 1fr laesst sich animieren,
     height:auto nicht. visibility schaltet erst nach dem Zuklappen, damit Links im
     geschlossenen Zustand weder fokussierbar noch vorlesbar sind. */
  .entry .detail{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;
                 transition:grid-template-rows .34s var(--ease),opacity .18s ease,visibility 0s linear .34s;}
  .entry.open .detail{grid-template-rows:1fr;opacity:1;visibility:visible;
                      transition:grid-template-rows .4s var(--ease),opacity .32s ease .08s,visibility 0s;}
  .entry .detail-in{min-height:0;overflow:hidden;}
  .entry .blurb{margin:12px 0 14px;color:var(--tx2);font-size:clamp(14px,3.9vw,15px);line-height:1.6;max-width:72ch;}
  .entry > .srcs{margin-top:12px;}
  /* Quelle als Pille mit Pfeil. Der Pfeil rueckt beim Hovern ein Stueck nach oben rechts. */
  .entry .srcs{display:flex;gap:8px;flex-wrap:wrap;}
  .entry .srcs a{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:500;
                 color:var(--tx2);background:var(--chip);padding:6px 11px 6px 13px;border-radius:999px;
                 transition:background-color .2s ease,color .2s ease;}
  .entry .srcs a:hover{background:var(--chip-hover);color:var(--tx);}
  .entry .srcs a:focus-visible{outline:2px solid var(--tx);outline-offset:2px;}
  .entry .srcs a svg{width:11px;height:11px;flex:none;transition:transform .25s var(--ease);}
  .entry .srcs a:hover svg{transform:translate(1.5px,-1.5px);}
  /* Gelesen: zurueckgenommen, nicht versteckt. Unterschied laeuft ueber Farbe und Gewicht. */
  .entry.read .head h3{color:var(--tx3);font-weight:500;}
  .entry.read .meta{opacity:.6;}
  /* Themenwechsel: der Strom blendet kurz neu ein, statt hart umzuspringen */
  #stream.swap{animation:swapin .34s var(--ease);}
  @keyframes swapin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  /* Hell/Dunkel nur waehrend des Umschaltens weich. Dauerhaft gesetzt wuerde die Regel
     jede andere Uebergangsregel ueberschreiben. */
  html.theming, html.theming *{transition:background-color .4s ease,color .4s ease,border-color .4s ease,fill .4s ease,box-shadow .4s ease !important;}
  @media (prefers-reduced-motion: reduce){
    .entry,.entry .detail,.entry.open .detail,.entry h3,#stream.swap,.island,.is-menu,.island.open .is-menu,.is-item i,.is-headwrap,.is-head{transition:none !important;animation:none !important;}
    .entry.pre{opacity:1;transform:none;}
    .is-dot,.is-dot.beat{animation:none;opacity:.85;transform:none;}
    .is-lbl .ch.roll{animation:none;}
  }

  /* Cursor: aussen die Position, innen der Puls. Zwei Ebenen, weil sonst
     transform fuer Position und Skalierung kollidieren. Nur bei echter Maus. */
  #cursor{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;
          transform:translate3d(-100px,-100px,0);will-change:transform;}
  /* Drei Ebenen: aussen die Position, in der Mitte die Groesse (transform statt
     Breite und Hoehe, damit nichts neu gesetzt wird), innen der Puls. Die mittlere
     Ebene hat keine eigene Groesse, ihr Ursprung ist damit der Zeigerpunkt. */
  #cursor b{display:block;transform:scale(1);transition:transform .18s ease;}
  #cursor.hot b{transform:scale(1.67);}
  #cursor i{display:block;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
            border-radius:50%;background:var(--tx);
            animation:pulsedot 1.6s ease-in-out infinite;}
  #cursor.hot i{animation-duration:.65s;}
  @keyframes pulsedot{0%,100%{transform:scale(.7);opacity:.5;} 50%{transform:scale(1);opacity:1;}}
  @media (hover:none),(pointer:coarse){ #cursor{display:none;} }
  @media (prefers-reduced-motion: reduce){ #cursor i{animation:none;opacity:.85;} }

  .sentinel{height:1px;}
  .status{font-family:var(--sans);font-size:11.5px;color:var(--tx3);padding:26px 0 40px;text-align:center;letter-spacing:0.05em;}
  .empty{font-family:var(--sans);font-size:12.5px;color:var(--tx3);padding:22px 0;}

  .foot{position:fixed;left:0;right:0;bottom:0;height:var(--footh);background:var(--bg);
        display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:10;}
  /* Impressum sitzt am Fensterrand, nicht in der Inhaltsspalte */
  .foot .inner{max-width:none;margin:0;padding:0 22px;width:100%;display:flex;align-items:center;justify-content:flex-end;}
  .foot a{font-family:var(--sans);font-size:10.5px;color:var(--tx3);letter-spacing:0.03em;transition:color .2s ease;}
  .foot a:hover{color:var(--tx);text-decoration:underline;text-underline-offset:3px;}
  /* Ganz am Ende, damit sie gegen spaetere cursor-Regeln gewinnt.
     Sonst zeigt der Browser ueber den Eintraegen weiter den nativen Zeiger. */
  @media (hover:hover) and (pointer:fine){
    *,body,a,button,.head,.entry,.is-item{cursor:none !important;}
  }
  @media(max-width:600px){
    /* Mindestens 30px Weissraum bis zum Displayrand. Der Eintrag behaelt seinen
       Innenabstand von 20px und den negativen Aussenabstand, sonst sitzt der
       Text auf der Kante der Flaeche. Text steht damit bei 30px, die Flaeche
       reicht bis 10px an den Rand. Gleiche Geometrie wie am Desktop. */
    .wrap{padding-left:30px;padding-right:30px;}
    /* Einordnung mobil etwas groesser, am Desktop bleibt sie bei 15px */
    .entry .blurb{font-size:16px;}
    .foot .inner{padding:0 30px;}
  }
</style>
</head>
<body>
<div id="cursor" aria-hidden="true"><b><i></i></b></div>

<nav class="island brand" id="island" aria-label="PULSE">
  <div class="is-headwrap"><div class="is-headin">
    <button class="is-head" id="isHead" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="isMenu">
      <span class="is-dot" id="isDot" aria-hidden="true"></span>
      <span class="is-lbl tnum"><span class="val" id="isVal">PULSE</span></span>
    </button>
  </div></div>
  <div class="is-menu" id="isMenu">
    <div class="is-in">
      <div class="is-list" id="isList" role="menu"></div>
      <div class="is-tools">
        <div class="langsw" id="langsw" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="de" aria-pressed="false">DE</button>
        </div>
        <button class="is-theme" id="themeToggle" type="button" aria-label="Dark mode"></button>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div id="stream"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="status" id="status"></div>
</div>

<footer class="foot">
  <div class="inner">
    <a href="https://thiele.studio/legal/" target="_blank" rel="noopener" id="footLegal">Impressum</a>
  </div>
</footer>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOTION=!matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE=matchMedia("(hover:hover) and (pointer:fine)").matches;
// Icons in einem Strich: 1.5, runde Enden. Pfeil, Personen-Glyph, Sonne, Mond.
const ARROW='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 8.5l5-5M4.5 3.5h4v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PERSON='<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="3.9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.9 10.9c.5-2.3 2.2-3.4 4.1-3.4s3.6 1.1 4.1 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const SUN='<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M3.5 12.5l1.2-1.2M11.3 4.7l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const MOON='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.3 10.2A5.7 5.7 0 0 1 5.8 2.7a5.7 5.7 0 1 0 7.5 7.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

const STR={
  en:{ all:"All", pulse:"PULSE",
       legal:"Imprint", loading:"loading …", end:"end of archive",
       nothing:"Nothing in this filter.", loadFail:"Could not load editions.",
       toDark:"Dark mode", toLight:"Light mode", topics:"Topics", lang:"Language" },
  de:{ all:"Alle", pulse:"PULSE",
       legal:"Impressum", loading:"lädt …", end:"Ende des Archivs",
       nothing:"Nichts in diesem Filter.", loadFail:"Konnte Ausgaben nicht laden.",
       toDark:"Dunkel", toLight:"Hell", topics:"Rubriken", lang:"Sprache" }
};
const THEMES=[
  {id:"design-practice",  en:"Design Practice",    de:"Design-Praxis"},
  {id:"brand-advertising",en:"Brand & Advertising",de:"Brand & Advertising"},
  {id:"craft-judgment",   en:"Craft & Judgment",   de:"Handwerk & Urteil"},
  {id:"industry-market",  en:"Industry & Market",  de:"Industrie & Markt"},
  {id:"ai-models",        en:"AI Models (+Tools)", de:"AI-Modelle (+Tools)"}
];
const themeLabel=id=>{const x=THEMES.find(y=>y.id===id);return x?x[state.lang]:"";};

let state={lang:"en",topic:"all",index:null,queue:[],loading:false,done:false,seenThemes:new Set()};
const t=()=>STR[state.lang];

// Gelesen-Zustand liegt im Browser, pro Geraet. Schluessel ist die erste
// Quellen-URL, weil sie stabil ist. Deckel gegen unbegrenztes Wachsen.
const READ_KEY="nr-read";
let readSet=new Set();
try{ readSet=new Set(JSON.parse(localStorage.getItem(READ_KEY)||"[]")); }catch(e){}
function saveRead(){
  try{
    let a=[...readSet];
    if(a.length>3000) a=a.slice(a.length-3000);
    readSet=new Set(a);
    localStorage.setItem(READ_KEY,JSON.stringify(a));
  }catch(e){}
}
function markRead(el){
  if(!el||el.classList.contains("read")) return;
  el.classList.add("read");
  const k=el.dataset.key; if(k){ readSet.add(k); saveRead(); }
}

// ---------------------------------------------------------------------------
// Quellenart. Ausgaben seit dem 08.10.2026 tragen `kind` je Quelle. Fuer den
// Altbestand raet das Frontend per Domain: Substack, Medium und die gefolgten
// Personen-Blogs sind Personen, alles andere ist ein Portal. Die Liste spiegelt
// config/sources.json fuer die Hosts, die sich nicht an der Domain erkennen lassen.
// ---------------------------------------------------------------------------
const PERSON_HOSTS=["lukew.com","bradfrost.com","wattenberger.com","interconnected.org","mattstromawn.com",
  "thesephist.com","karrisaarinen.com","subtraction.com","newsletter.polaine.com","arxiv.org",
  "userresearchstrategist.com","the-ai-corner.com","productcompass.pm","creatoreconomy.so",
  "interconnects.ai","ai-supremacy.com","oneusefulthing.org","growthmates.news","newsletter.brxnd.ai","uxdesign.cc"];
function hostOf(u){ try{ return new URL(u).host.replace(/^www\./,""); }catch(e){ return ""; } }
function guessKind(url){
  const h=hostOf(url);
  if(/(^|\.)substack\.com$/.test(h)||/(^|\.)medium\.com$/.test(h)) return "person";
  if(PERSON_HOSTS.some(p=>h===p||h.endsWith("."+p))) return "person";
  return "portal";
}
// Wer steht in der Overline: bei Personen der Autor, bei Portalen das Portal.
function whoOf(q){
  const kind=q.kind||guessKind(q.url);
  return { kind, label: kind==="person" ? (q.author||q.name) : q.name };
}

// ---------------------------------------------------------------------------
// Hell/Dunkel
// ---------------------------------------------------------------------------
(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("nr-theme")||"light"); })();
function syncToggle(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const b=$("#themeToggle"); b.innerHTML=dark?SUN:MOON; b.setAttribute("aria-label", dark?t().toLight:t().toDark);
}
let themeTimer=0;
$("#themeToggle").onclick=()=>{
  const root=document.documentElement;
  if(MOTION){ root.classList.add("theming"); clearTimeout(themeTimer); themeTimer=setTimeout(()=>root.classList.remove("theming"),450); }
  const c=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",c); localStorage.setItem("nr-theme",c); syncToggle();
};

// ---------------------------------------------------------------------------
// Strom
// ---------------------------------------------------------------------------
// Stimmen und Themen laufen in einem Strom. Stimmen-Beitraege haben keine
// Einordnung, sie tragen die Person als Quelle.
function entriesOf(ed){
  const out=(ed.stories||[]).map(s=>({
    theme:s.theme, title:s.title, blurb:s.blurb||"",
    sources:(s.sources||[]).map(q=>({name:q.name,url:q.url,kind:q.kind,author:q.author,channel:q.channel}))
  }));
  for(const v of (ed.voices||[])){
    for(const i of (v.items||[])){
      // Altbestand: Stimmen vor dem 10.09.2026 haben keine Einordnung
      out.push({theme:v.topic, title:i.title, blurb:"", sources:[{name:v.name,url:i.url,kind:"person",author:v.name}]});
    }
  }
  return out;
}

function metaHTML(e){
  const lead=e.sources[0];
  const who=lead?whoOf(lead):null;
  const n=e.sources.length;
  return `<div class="meta">
    <span class="rub">${esc(themeLabel(e.theme))}</span>
    ${who?`<span class="sep" aria-hidden="true">•</span><span class="src">${who.kind==="person"?PERSON:""}${esc(who.label)}</span>`:""}
    ${n>1?`<span class="more tnum" title="${n}">+${n-1}</span>`:""}
  </div>`;
}

function dayHTML(date,label,entries){
  const rows=entries.map(e=>{
    const href=e.sources[0]?e.sources[0].url:"";
    const key=href;
    // Pille: der Kanal, wenn es einen gibt (UX Collective), sonst der Quellenname
    const srcs=e.sources.map(q=>`<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.channel||q.name)}${ARROW}</a>`).join("");
    const isRead=readSet.has(key);
    // Mit Einordnung klappt die Schlagzeile auf. Ohne Einordnung (Altbestand)
    // fuehrt sie direkt zur Quelle, sonst waere der Klick ohne Wirkung.
    const head = e.blurb
      ? `<div class="head" role="button" tabindex="0" aria-expanded="false"><h3>${esc(e.title)}</h3></div>`
      : `<a class="head" href="${esc(href)}" target="_blank" rel="noopener"><h3>${esc(e.title)}</h3></a>`;
    return `<article class="entry${isRead?" read":""}${MOTION?" pre":""}" data-theme="${esc(e.theme||"")}" data-key="${esc(key)}">
      ${metaHTML(e)}
      ${head}
      ${e.blurb
        ? `<div class="detail"><div class="detail-in"><p class="blurb">${esc(e.blurb)}</p><div class="srcs">${srcs}</div></div></div>`
        : `<div class="srcs">${srcs}</div>`}
    </article>`;
  }).join("");
  return `<section class="day" data-date="${esc(date)}" data-label="${esc(label)}">${rows}</section>`;
}

async function loadNext(){
  if(state.loading||state.done) return;
  if(!state.queue.length){ state.done=true; $("#status").textContent=t().end; return; }
  state.loading=true; $("#status").textContent=t().loading;
  const meta=state.queue.shift();
  try{
    const ed=await (await fetch(`./editions/${state.lang}/${meta.date}.json`,{cache:"no-store"})).json();
    const entries=entriesOf(ed);
    entries.forEach(e=>{ if(e.theme) state.seenThemes.add(e.theme); });
    const label=(meta.label&&meta.label[state.lang])||meta.date;
    $("#stream").insertAdjacentHTML("beforeend", dayHTML(meta.date,label,entries));
    renderMenu();
    applyFilter();
  }catch(e){ /* fehlende Ausgabe still ueberspringen, das Archiv hat Luecken */ }
  state.loading=false;
  $("#status").textContent = state.queue.length ? "" : t().end;
  syncDate();
  // Falls der Sentinel nach dem Anhaengen noch sichtbar ist, direkt weiterladen
  requestAnimationFrame(maybeLoad);
}

// ---------------------------------------------------------------------------
// Island
// ---------------------------------------------------------------------------
const island=$("#island"), isHead=$("#isHead"), isList=$("#isList"), isVal=$("#isVal"), isDot=$("#isDot");
let isOpen=false, hoverT=0, suppressHover=false, widthT=0, menuSig="";
let showingDate=false, dateT=0;

// Breite laesst sich von auto nicht animieren. Also: alte Breite messen und
// festhalten, Inhalt aendern, neue Breite messen, dann von alt nach neu fahren.
// Nach dem Lauf wird die Breite wieder freigegeben, damit Labelwechsel ohne
// Animation sauber nachziehen.
function morph(apply){
  if(!MOTION){ apply(); island.style.width=""; return; }
  clearTimeout(widthT);
  const w0=island.getBoundingClientRect().width;
  island.style.transition="none"; island.style.width=w0+"px"; void island.offsetWidth;
  apply();
  island.style.width="auto"; const w1=island.getBoundingClientRect().width;
  island.style.width=w0+"px"; void island.offsetWidth;
  island.style.transition=""; island.style.width=w1+"px";
  widthT=setTimeout(()=>{ island.style.width=""; },480);
}
function topicLabelText(){ return state.topic==="all" ? t().pulse : themeLabel(state.topic); }
function setLabel(){
  if(showingDate) return;               // das Datum traegt gerade, danach kommt das Thema von selbst
  morph(()=>{ island.classList.toggle("brand",state.topic==="all"); island.classList.remove("date"); isVal.textContent=topicLabelText(); });
}
let HEAD_H=35;   // Hoehe des Kopfs im Ruhezustand, einmal beim Start gemessen
function setOpen(o,opts){
  if(isOpen===o) return;
  isOpen=o;
  morph(()=>island.classList.toggle("open",o));
  isHead.setAttribute("aria-expanded",String(o));
  // Offen ist der Kopf unsichtbar: raus aus der Tab-Reihenfolge. Wurde per Klick
  // oder Tastatur geoeffnet, wandert der Fokus auf die aktive Rubrik. Bei Hover
  // bleibt der Fokus, wo er war.
  isHead.tabIndex = o ? -1 : 0;
  if(o && opts && opts.focus) requestAnimationFrame(()=>{ (isList.querySelector('.is-item[aria-checked="true"]')||isList.querySelector(".is-item"))?.focus({preventScroll:true}); });
}
function renderMenu(){
  const list=[{id:"all",label:t().all}].concat(THEMES.filter(x=>state.seenThemes.has(x.id)).map(x=>({id:x.id,label:x[state.lang]})));
  const sig=state.lang+"|"+list.map(x=>x.id).join(",")+"|"+state.topic;
  if(sig===menuSig) return; menuSig=sig;
  isList.innerHTML=list.map(x=>`<button class="is-item" type="button" role="menuitemradio" aria-checked="${state.topic===x.id}" data-t="${x.id}"><i aria-hidden="true"></i>${esc(x.label)}</button>`).join("");
  isList.querySelectorAll(".is-item").forEach(b=>b.onclick=()=>{
    if(state.topic!==b.dataset.t){ state.topic=b.dataset.t; renderMenu(); setLabel(); applyFilter(); swapStream(); }
    setOpen(false); if(FINE) suppressHover=true;   // nicht sofort wieder aufgehen, solange der Zeiger drueber steht
    isHead.focus({preventScroll:true});             // der Fokus kehrt zum Kopf zurueck, das Menue ist weg
  });
}
// Hover am Desktop, Tipp auf Touch. Klick auf den Kopf schaltet immer, auch per Tastatur.
island.addEventListener("mouseenter",()=>{ if(!FINE||suppressHover) return; clearTimeout(hoverT); setOpen(true); });
island.addEventListener("mouseleave",()=>{ if(!FINE) return; suppressHover=false; clearTimeout(hoverT); hoverT=setTimeout(()=>setOpen(false),200); });
isHead.addEventListener("click",()=>{ setOpen(!isOpen,{focus:true}); if(!isOpen && FINE) suppressHover=true; });
document.addEventListener("pointerdown",e=>{ if(isOpen && !island.contains(e.target)) setOpen(false); },{passive:true});
island.addEventListener("focusout",e=>{ if(isOpen && !island.contains(e.relatedTarget)) setOpen(false); });
island.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ setOpen(false); isHead.focus(); return; }
  if(e.key!=="ArrowDown" && e.key!=="ArrowUp") return;
  const items=[...isList.querySelectorAll(".is-item")]; if(!items.length) return;
  if(!isOpen){ setOpen(true); }
  const i=items.indexOf(document.activeElement);
  const n=e.key==="ArrowDown" ? (i+1)%items.length : (i<=0?items.length-1:i-1);
  e.preventDefault(); items[n].focus();
});

// Herzschlag folgt dem Scrollen: schnelles Scrollen verkuerzt die Periode,
// in Ruhe laeuft sie wieder auf 1,9s hoch. Nicht ueber rAF, ein Zeitgeber reicht.
let hbT=0, hbLast=0;
function pulseFromScroll(dy,now){
  if(!MOTION) return;
  const dt=Math.max(now-hbLast,16); hbLast=now;
  const v=Math.abs(dy)/dt;                          // Pixel je Millisekunde
  const target=Math.max(.75, 1.9 - v*1.3);
  const cur=parseFloat(island.style.getPropertyValue("--hbd"))||1.9;
  if(target<cur-.04) island.style.setProperty("--hbd", target.toFixed(2)+"s");
  clearTimeout(hbT); hbT=setTimeout(relaxPulse,240);
}
function relaxPulse(){
  const cur=parseFloat(island.style.getPropertyValue("--hbd"))||1.9;
  if(cur>=1.9){ island.style.removeProperty("--hbd"); return; }
  island.style.setProperty("--hbd", Math.min(1.9,cur+.22).toFixed(2)+"s");
  hbT=setTimeout(relaxPulse,240);
}

// Split-Flap fuer das Datum. Jede Stelle rollt durch ein paar Zwischenzeichen
// und rastet ein, versetzt von links nach rechts. Ueber setTimeout, nicht ueber
// requestAnimationFrame, damit es auch in inaktiven Tabs sauber durchlaeuft.
const POOL_ZIFFER="0123456789";
const POOL_BUCHSTABE="ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ";
let flipTimers=[];
function poolFor(c){
  if(/[0-9]/.test(c)) return POOL_ZIFFER;
  if(/[a-zäöüß]/i.test(c)) return POOL_BUCHSTABE;
  return null;                       // Leerzeichen, Punkt, Komma stehen sofort
}
function renderChars(v,text){
  v.innerHTML=[...text].map(c=>`<span class="ch${c===" "?" sp":""}">${esc(c)}</span>`).join("");
}
function flipDateText(label){
  flipTimers.forEach(clearTimeout); flipTimers=[];
  const alt=[...isVal.querySelectorAll(".ch")].map(s=>s.textContent);
  renderChars(isVal,label);
  const felder=[...isVal.querySelectorAll(".ch")];
  let ende=0;
  felder.forEach((span,i)=>{
    const ziel=label[i], pool=poolFor(ziel);
    if(!pool) return;
    const schritte=3+Math.floor(Math.random()*4);
    const start=i*28, dauer=start+schritte*55;
    if(dauer>ende) ende=dauer;
    let n=0;
    span.textContent = alt[i]!==undefined ? alt[i] : ziel;
    const tick=()=>{
      span.textContent = n<schritte ? pool[Math.floor(Math.random()*pool.length)] : ziel;
      span.classList.remove("roll"); void span.offsetWidth; span.classList.add("roll");
      n++;
      if(n<=schritte) flipTimers.push(setTimeout(tick,55));
    };
    flipTimers.push(setTimeout(tick,start));
    // Eigener Einrast-Zeitgeber je Stelle. Verkettete kurze Timer werden in
    // inaktiven Tabs gedrosselt und brechen ab, dann bliebe Buchstabensalat stehen.
    flipTimers.push(setTimeout(()=>{ span.textContent=ziel; },dauer+40));
  });
  // Letzte Sicherung fuer den ganzen String, ein einzelner langer Zeitgeber
  flipTimers.push(setTimeout(()=>{ if(isVal.textContent!==label) renderChars(isVal,label); },ende+220));
}
// Tageswechsel: der Punkt schlaegt einmal hart, die Pille weitet sich zum Datum
// und zieht sich nach kurzer Standzeit auf die Rubrik zurueck. Bei offenem Menue
// bleibt der Wechsel stumm, dort stoert er nur.
function flashDate(label){
  if(isOpen) return;
  showingDate=true; clearTimeout(dateT);
  if(MOTION){ isDot.classList.remove("beat"); void isDot.offsetWidth; isDot.classList.add("beat"); }
  // Im Hintergrundtab wird jeder Zeitgeber auf rund eine Sekunde gedrosselt.
  // Dann lieber hart setzen, es schaut ohnehin niemand hin.
  const sichtbar = document.visibilityState === "visible";
  morph(()=>{
    island.classList.add("date"); island.classList.remove("brand");
    if(!MOTION || !sichtbar) renderChars(isVal,label); else flipDateText(label);
  });
  dateT=setTimeout(()=>{ showingDate=false; isDot.classList.remove("beat"); setLabel(); },2300);
}
let shownDate=null;
function syncDate(){
  // Bezugslinie ist die Oberkante des Islands plus die Ruhehoehe des Kopfs. Weder
  // die Islandkante (springt beim Oeffnen um rund 280px) noch der Kopf selbst
  // (klappt offen auf null) taugen als Mass, sonst wechselt der "aktuelle" Tag
  // scheinbar und das Datum blitzt grundlos auf (geprueft 08.10.2026).
  const bar=island.getBoundingClientRect().top+HEAD_H;
  let cur=null;
  document.querySelectorAll(".day").forEach(d=>{ if(!d.hidden && d.getBoundingClientRect().top<=bar+8) cur=d; });
  cur=cur||document.querySelector(".day:not([hidden])");
  if(!cur) return;
  const label=cur.dataset.label;
  // Beim ersten Lauf nur merken, nicht zeigen. Der Wechsel gehoert dem Scrollen.
  if(shownDate===null){ shownDate=label; return; }
  if(label!==shownDate){ shownDate=label; flashDate(label); }
}

// ---------------------------------------------------------------------------
// Scrollen: Datum, Nachladen, Einblenden, Herzschlag. Ueber die Scroll-Schleife,
// nicht ueber IntersectionObserver. Der Observer feuerte im Test nicht
// zuverlaessig, obwohl der Sentinel im Viewport stand (geprueft 10.09.2026).
// ---------------------------------------------------------------------------
let ticking=false, lastY=0;
function onScroll(){
  if(ticking) return;
  ticking=true;
  requestAnimationFrame(now=>{
    ticking=false;
    const y=window.scrollY||document.documentElement.scrollTop||0;
    const dy=y-lastY; lastY=y;
    if(dy) pulseFromScroll(dy,now);
    if(isOpen && Math.abs(dy)>30) setOpen(false);   // Scrollen schliesst das Menue
    syncDate();
    maybeLoad();
    revealVisible();
  });
}
function vh(){ return window.innerHeight || document.documentElement.clientHeight || 800; }
function maybeLoad(){
  const el=$("#sentinel"); if(!el) return;
  if(el.getBoundingClientRect().top < vh() + 700) loadNext();
}
// Eintraege blenden ein, sobald sie ins Bild kommen. Der erste getBoundingClientRect
// erzwingt den Stil mit .pre, erst dadurch laeuft der Uebergang.
function revealVisible(){
  if(!MOTION) return;
  const lim=vh()*0.94; let n=0;
  document.querySelectorAll(".entry.pre").forEach(el=>{
    if(el.hidden) return;
    if(el.getBoundingClientRect().top<lim){
      el.style.setProperty("--rd",Math.min(n,6)*45+"ms"); n++;
      el.classList.remove("pre");
    }
  });
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) revealVisible(); });
function swapStream(){
  if(!MOTION) return;
  const s=$("#stream"); s.classList.remove("swap"); void s.offsetWidth; s.classList.add("swap");
}
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",onScroll,{passive:true});

// Zweiter, unabhaengiger Ausloeser. Einer der beiden reicht; sie doppeln sich
// absichtlich, weil das Nachladen sonst an einer einzigen API haengt.
try{
  new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) loadNext(); },{rootMargin:"700px"}).observe($("#sentinel"));
}catch(e){}

// ---------------------------------------------------------------------------
// Eintraege auf- und zuklappen
// ---------------------------------------------------------------------------
function closeEntry(art){
  if(!art.classList.contains("open")) return;
  art.classList.remove("open");
  art.querySelector(".head")?.setAttribute("aria-expanded","false");
  markRead(art);          // gelesen zaehlt beim Schliessen, nicht beim Oeffnen
}
function toggleEntry(art){
  const head=art.querySelector(".head");
  if(!art.querySelector(".detail")||!head) return;
  const open=!art.classList.contains("open");
  // Immer nur ein Eintrag offen. Beim Oeffnen alle anderen schliessen.
  if(open) document.querySelectorAll(".entry.open").forEach(o=>{ if(o!==art) closeEntry(o); });
  art.classList.toggle("open",open);
  head.setAttribute("aria-expanded",String(open));
  if(!open) markRead(art);   // zugeklappt heisst gelesen
}
$("#stream").addEventListener("click",ev=>{
  const art=ev.target.closest(".entry"); if(!art) return;
  if(ev.target.closest("a")){ markRead(art); return; }   // Links gewinnen, raus zum Artikel
  // Textauswahl nicht als Klick werten
  const sel=window.getSelection && window.getSelection().toString();
  if(sel && sel.length>2) return;
  ev.preventDefault();
  toggleEntry(art);                                      // der ganze Eintrag schaltet
});
$("#stream").addEventListener("keydown",ev=>{
  if(ev.key!=="Enter" && ev.key!==" ") return;
  const head=ev.target.closest(".head[role=button]"); if(!head) return;
  ev.preventDefault(); toggleEntry(head.closest(".entry"));
});

function applyFilter(){
  document.querySelectorAll(".entry").forEach(el=>{
    el.hidden = !(state.topic==="all" || el.dataset.theme===state.topic);
  });
  document.querySelectorAll(".day").forEach(d=>{
    d.hidden = ![...d.querySelectorAll(".entry")].some(e=>!e.hidden);
  });
  syncDate(); maybeLoad(); revealVisible();
}

// ---------------------------------------------------------------------------
// Sprache und Start
// ---------------------------------------------------------------------------
function syncLang(){
  $("#langsw").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===state.lang));
  $("#langsw").setAttribute("aria-label",t().lang);
  isList.setAttribute("aria-label",t().topics);
  document.documentElement.lang=state.lang;
  $("#footLegal").textContent=t().legal;
  syncToggle();
}
function resetStream(){
  lastY=window.scrollY||0; shownDate=null; menuSig="";
  clearTimeout(dateT); showingDate=false; island.classList.remove("date");
  $("#stream").innerHTML=""; $("#status").textContent="";
  state.queue=state.index.editions.slice();
  state.done=false; state.loading=false; state.seenThemes=new Set();
  renderMenu(); setLabel();
  loadNext();
}
async function boot(){
  lastY=window.scrollY||document.documentElement.scrollTop||0;
  HEAD_H=isHead.offsetHeight||HEAD_H;
  try{
    state.index=await (await fetch("./editions/index.json",{cache:"no-store"})).json();
    state.lang=localStorage.getItem("nr-lang")||state.index.default_lang||"en";
    syncLang();
    resetStream();
  }catch(e){ isVal.textContent=t().loadFail; island.classList.remove("brand"); }
}
$("#langsw").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  if(state.lang===b.dataset.lang) return;
  state.lang=b.dataset.lang; localStorage.setItem("nr-lang",state.lang);
  syncLang(); state.topic="all"; setOpen(false); if(FINE) suppressHover=true; resetStream();
});
syncToggle();
boot();

// ---------------------------------------------------------------------------
// Cursor als pulsierender Punkt. Ueber einem klickbaren Element wird er groesser
// und schlaegt schneller. Nur bei echter Maus, Touch bleibt unberuehrt.
// ---------------------------------------------------------------------------
(function(){
  const c=document.getElementById("cursor"); if(!c) return;
  if(!FINE) return;
  // Direkt schreiben statt ueber requestAnimationFrame. Ein Cursor darf keinen
  // Frame nachlaufen, und rAF feuert in versteckten Tabs gar nicht.
  addEventListener("mousemove",e=>{
    c.style.transform="translate3d("+e.clientX+"px,"+e.clientY+"px,0)";
    c.classList.toggle("hot", !!e.target.closest(".entry, a, button"));
  },{passive:true});
  addEventListener("mouseleave",()=>{ c.style.opacity="0"; });
  addEventListener("mouseenter",()=>{ c.style.opacity="1"; });
})();
</script>
