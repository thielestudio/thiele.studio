<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>PULSE</title>
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --line:#e6e5e1; --line2:#d3d2cc;
    --tx:#17161a; --tx2:#54535a; --tx3:#8a8991; --accent:#17161a; --accent-tx:#ffffff;
    --chip:#f1f0ee; --chip-hover:#e7e6e3;
    --hover:#ffffff; --hover-shadow:0 1px 2px rgba(23,22,26,.05), 0 10px 28px rgba(23,22,26,.08);
    --sans:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --footh:44px;
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0c; --surface:#141416; --line:#242427; --line2:#34343a;
    --tx:#fafafa; --tx2:#a6a6ad; --tx3:#77767e; --accent:#fafafa; --accent-tx:#0b0b0c;
    --hover:#17171b; --hover-shadow:none;
    --chip:#1c1c20; --chip-hover:#26262b;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:clamp(14px,3.9vw,15px);line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px calc(var(--footh) + 70px);}
  .label{font-family:var(--sans);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--tx3);}
  .tnum{font-variant-numeric:tabular-nums;}

  header{padding:34px 0 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand h1{font-size:clamp(21px,5.6vw,25px);line-height:1.05;margin:0 0 4px;letter-spacing:0.02em;}
  .brand .ed{font-family:var(--sans);font-size:12px;color:var(--tx3);}
  .htools{display:flex;gap:8px;align-items:center;}
  .tbtn{font-family:var(--sans);font-size:12px;color:var(--tx2);background:var(--surface);border:1px solid var(--line2);padding:7px 11px;cursor:pointer;border-radius:999px;}
  .tbtn:hover{border-color:var(--tx3);color:var(--tx);}
  .langsw{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;}
  .langsw button{font-family:var(--sans);font-size:12px;letter-spacing:0.04em;background:none;border:none;color:var(--tx2);padding:7px 11px;cursor:pointer;}
  .langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-tx);}

  /* Sticky Kopf: Datum laeuft beim Scrollen mit */
  .runbar{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 0 13px;display:flex;flex-direction:column;gap:11px;}
  /* Datum schwebt zentriert am unteren Rand und ist dauerhaft aus. Es blitzt
     nur auf, wenn beim Scrollen ein anderer Tag den Kopf erreicht. Unten, weil
     es oben die Themen-Navi ueberlagert haette. */
  .datetoast{position:fixed;bottom:calc(var(--footh) + 22px);left:50%;
             transform:translateX(-50%) translateY(6px);
             z-index:20;opacity:0;pointer-events:none;perspective:320px;
             transition:opacity .2s ease,transform .2s ease;}
  .datetoast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .datetoast .bub{display:inline-block;background:var(--chip);color:var(--tx2);
                  font-size:13.75px;letter-spacing:0.06em;text-transform:uppercase;
                  padding:9px 19px;border-radius:999px;box-shadow:var(--hover-shadow);}
  .datetoast .bub.pulse{animation:bubpulse .5s cubic-bezier(.34,1.56,.64,1);}
  /* Split-Flap: jede Stelle ist ein eigenes Blatt mit fester Laufweite, sonst
     zappelt die Pille waehrend des Durchrollens. */
  .datetoast .val{display:inline-flex;}
  /* Blattbreite gemessen, nicht geschaetzt: breitestes vorkommendes Zeichen ist
     das M mit 0.90em bei Gewicht 500. 0.88em laesst Luft und die Blaetter kleben
     nicht. Die Laufweite entsteht ueber die feste Breite, nicht ueber
     letter-spacing, sonst sitzt das Zeichen ausserhalb der Blattmitte. */
  .datetoast .ch{display:inline-block;width:.88em;text-align:center;font-weight:500;
                 letter-spacing:0;transform-origin:50% 60%;backface-visibility:hidden;}
  .datetoast .ch.sp{width:.42em;}
  .datetoast .ch.roll{animation:chroll .085s linear;}
  @keyframes bubpulse{0%{transform:scale(1);}38%{transform:scale(1.07);}100%{transform:scale(1);}}
  @keyframes chroll{from{transform:rotateX(-62deg);opacity:.4;} to{transform:rotateX(0);opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .datetoast .bub.pulse,.datetoast .ch.roll{animation:none;}
  }
  /* Themen als Schiene: graue Spur, weisse Kachel faehrt zum aktiven Reiter.
     Auf schmalen Fenstern scrollt die Spur seitlich statt umzubrechen. */
  .topics{position:relative;display:flex;flex-wrap:nowrap;gap:0;width:fit-content;max-width:100%;
          background:var(--chip);border-radius:999px;padding:4px;
          overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
          scrollbar-width:none;max-height:240px;opacity:1;
          transition:max-height .22s ease,opacity .16s ease,padding .22s ease;}
  .topics::-webkit-scrollbar{display:none;}
  .runbar.compact{gap:0;}
  .runbar.compact .topics{max-height:0;opacity:0;padding-top:0;padding-bottom:0;}
  .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;
         background:var(--bg);box-shadow:var(--hover-shadow);z-index:0;
         transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);}
  .thumb.noanim{transition:none;}
  .chip{position:relative;z-index:1;white-space:nowrap;font-family:var(--sans);font-size:11px;
        font-weight:500;letter-spacing:0.03em;text-transform:uppercase;color:var(--tx2);
        background:none;border:0;padding:7px 14px;cursor:pointer;border-radius:999px;
        transition:color .18s ease;}
  .chip:hover{color:var(--tx);}
  .chip[aria-pressed="true"]{color:var(--tx);}

  /* Timeline: keine Trennstriche, Rhythmus ueber Weissraum */
  /* Kein Datum im Strom, das traegt der Sticky-Balken. Der Tageswechsel
     zeigt sich ueber den groesseren Abstand. */
  .day{padding:22px 0 0;}
  .day + .day{padding-top:44px;}
  .entry{padding:18px 20px;margin:0 -20px 16px;border-radius:24px;
         transition:background .15s ease,box-shadow .18s ease;}
  .entry:hover{background:var(--hover);box-shadow:var(--hover-shadow);}
  .entry .meta{font-family:var(--sans);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:9px;}
  .entry h3{margin:0 0 10px;font-size:clamp(16.5px,4.6vw,19px);font-weight:600;line-height:1.34;letter-spacing:-0.005em;}
  .entry a.head:hover h3{text-decoration:underline;text-underline-offset:3px;}
  .entry .srcs{font-family:var(--sans);font-size:11.5px;color:var(--tx3);display:flex;gap:14px;flex-wrap:wrap;}
  .entry .srcs a:hover{color:var(--tx);text-decoration:underline;text-underline-offset:3px;}
  .entry .head{cursor:pointer;display:block;}
  .entry .head:hover h3{text-decoration:underline;text-underline-offset:3px;}
  .entry .blurb{margin:0 0 14px;color:var(--tx2);font-size:clamp(14px,3.9vw,15px);line-height:1.6;}
  .entry .detail[hidden]{display:none;}
  /* Gelesen: zurueckgenommen, nicht versteckt. Unterschied laeuft ueber Farbe und Gewicht. */
  .entry.read .head h3{color:var(--tx3);font-weight:500;}
  .entry.read .meta{opacity:.6;}

  /* Cursor: aussen die Position, innen der Puls. Zwei Ebenen, weil sonst
     transform fuer Position und Skalierung kollidieren. Nur bei echter Maus. */
  #cursor{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;
          transform:translate3d(-100px,-100px,0);will-change:transform;}
  #cursor i{display:block;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
            border-radius:50%;background:var(--tx);
            animation:pulsedot 1.6s ease-in-out infinite;
            transition:width .18s ease,height .18s ease,margin .18s ease;}
  #cursor.hot i{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;animation-duration:.65s;}
  @keyframes pulsedot{0%,100%{transform:scale(.7);opacity:.5;} 50%{transform:scale(1);opacity:1;}}
  @media (hover:none),(pointer:coarse){ #cursor{display:none;} }
  @media (prefers-reduced-motion: reduce){ #cursor i{animation:none;opacity:.85;} }

  /* Der ganze Eintrag ist die Klickflaeche, nicht nur die Schlagzeile */
  .entry{cursor:pointer;}

  .sentinel{height:1px;}
  .status{font-family:var(--sans);font-size:11.5px;color:var(--tx3);padding:26px 0 40px;text-align:center;letter-spacing:0.05em;}
  .empty{font-family:var(--sans);font-size:12.5px;color:var(--tx3);padding:22px 0;}

  .foot{position:fixed;left:0;right:0;bottom:0;height:var(--footh);background:var(--bg);
        display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:10;}
  /* Impressum sitzt am Fensterrand, nicht in der Inhaltsspalte */
  .foot .inner{max-width:none;margin:0;padding:0 22px;width:100%;display:flex;align-items:center;justify-content:flex-end;}
  .foot a{font-family:var(--sans);font-size:10.5px;color:var(--tx3);letter-spacing:0.03em;}
  .foot a:hover{color:var(--tx);text-decoration:underline;text-underline-offset:3px;}
  /* Ganz am Ende, damit sie gegen spaetere cursor-Regeln gewinnt.
     Sonst zeigt der Browser ueber den Eintraegen weiter den nativen Zeiger. */
  @media (hover:hover) and (pointer:fine){
    *,body,a,button,.head,.entry,.chip{cursor:none !important;}
  }
  @media(max-width:600px){
    header{flex-direction:column;}
    /* Mindestens 30px Weissraum bis zum Displayrand. Der negative Aussenabstand
       der Eintraege frass das Polster vorher bis auf 2px auf, deshalb faellt er
       hier weg. Die Hover-Flaeche ist ohnehin eine Maus-Angelegenheit. */
    .wrap{padding-left:30px;padding-right:30px;}
    .entry{padding-left:0;padding-right:0;margin-left:0;margin-right:0;}
    .foot .inner{padding:0 30px;}
    .entry{padding-top:14px;padding-bottom:14px;}
  }
</style>
</head>
<body>
<div id="cursor" aria-hidden="true"><i></i></div>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>PULSE</h1>
    </div>
    <div class="htools">
      <div class="langsw" id="langsw">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="de" aria-pressed="false">DE</button>
      </div>
      <button class="tbtn" id="themeToggle" aria-label="Light/Dark">☀︎</button>
    </div>
  </header>

  <div class="runbar">
    <div class="topics" id="topics"></div>
  </div>

  <div id="stream"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="status" id="status"></div>
</div>

<div class="datetoast tnum" id="nowDate" aria-live="polite"><span class="bub"><span class="val"></span></span></div>

<footer class="foot">
  <div class="inner">
    <a href="https://thiele.studio/legal/" target="_blank" rel="noopener" id="footLegal">Impressum</a>
  </div>
</footer>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STR={
  en:{ all:"All",
       legal:"Imprint", loading:"loading …", end:"end of archive",
       nothing:"Nothing in this filter.", loadFail:"Could not load editions." },
  de:{ all:"Alle",
       legal:"Impressum", loading:"lädt …", end:"Ende des Archivs",
       nothing:"Nichts in diesem Filter.", loadFail:"Konnte Ausgaben nicht laden." }
};
const THEMES=[
  {id:"design-practice",  en:"Design Practice",    de:"Design-Praxis"},
  {id:"brand-advertising",en:"Brand & Advertising",de:"Brand & Advertising"},
  {id:"craft-judgment",   en:"Craft & Judgment",   de:"Handwerk & Urteil"},
  {id:"industry-market",  en:"Industry & Market",  de:"Industrie & Markt"},
  {id:"ai-models",        en:"AI Models (+Tools)", de:"AI-Modelle (+Tools)"}
];
const themeLabel=id=>{const x=THEMES.find(y=>y.id===id);return x?x[state.lang]:"";};

let state={lang:"en",topic:"all",index:null,queue:[],loading:false,done:false,seenThemes:new Set()};
const t=()=>STR[state.lang];

// Gelesen-Zustand liegt im Browser, pro Geraet. Schluessel ist die erste
// Quellen-URL, weil sie stabil ist. Deckel gegen unbegrenztes Wachsen.
const READ_KEY="nr-read";
let readSet=new Set();
try{ readSet=new Set(JSON.parse(localStorage.getItem(READ_KEY)||"[]")); }catch(e){}
function saveRead(){
  try{
    let a=[...readSet];
    if(a.length>3000) a=a.slice(a.length-3000);
    readSet=new Set(a);
    localStorage.setItem(READ_KEY,JSON.stringify(a));
  }catch(e){}
}
function markRead(el){
  if(!el||el.classList.contains("read")) return;
  el.classList.add("read");
  const k=el.dataset.key; if(k){ readSet.add(k); saveRead(); }
}

(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("nr-theme")||"light"); })();
function syncToggle(){ $("#themeToggle").textContent = document.documentElement.getAttribute("data-theme")==="dark" ? "☾" : "☀︎"; }
$("#themeToggle").onclick=()=>{ const c=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",c); localStorage.setItem("nr-theme",c); syncToggle(); };
syncToggle();

// Stimmen und Themen laufen in einem Strom. Stimmen-Beitraege haben keine
// Einordnung, sie tragen die Person als Quelle.
function entriesOf(ed){
  const out=(ed.stories||[]).map(s=>({
    theme:s.theme, title:s.title, blurb:s.blurb||"",
    sources:(s.sources||[]).map(q=>({name:q.name,url:q.url}))
  }));
  for(const v of (ed.voices||[])){
    for(const i of (v.items||[])){
      // Altbestand: Stimmen vor dem 10.09.2026 haben keine Einordnung
      out.push({theme:v.topic, title:i.title, blurb:"", sources:[{name:v.name,url:i.url}]});
    }
  }
  return out;
}

function dayHTML(date,label,entries){
  const rows=entries.map(e=>{
    const href=e.sources[0]?e.sources[0].url:"";
    const key=href;
    const srcs=e.sources.map(q=>`<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.name)}</a>`).join("");
    const isRead=readSet.has(key);
    // Mit Einordnung klappt die Schlagzeile auf. Ohne Einordnung (Altbestand)
    // fuehrt sie direkt zur Quelle, sonst waere der Klick ohne Wirkung.
    const head = e.blurb
      ? `<div class="head" role="button" tabindex="0" aria-expanded="false"><h3>${esc(e.title)}</h3></div>`
      : `<a class="head" href="${esc(href)}" target="_blank" rel="noopener"><h3>${esc(e.title)}</h3></a>`;
    return `<article class="entry${isRead?" read":""}" data-theme="${esc(e.theme||"")}" data-key="${esc(key)}">
      <div class="meta">${esc(themeLabel(e.theme))}</div>
      ${head}
      ${e.blurb
        ? `<div class="detail" hidden><p class="blurb">${esc(e.blurb)}</p><div class="srcs">${srcs}</div></div>`
        : `<div class="srcs">${srcs}</div>`}
    </article>`;
  }).join("");
  return `<section class="day" data-date="${esc(date)}" data-label="${esc(label)}">${rows}</section>`;
}

async function loadNext(){
  if(state.loading||state.done) return;
  if(!state.queue.length){ state.done=true; $("#status").textContent=t().end; return; }
  state.loading=true; $("#status").textContent=t().loading;
  const meta=state.queue.shift();
  try{
    const ed=await (await fetch(`./editions/${state.lang}/${meta.date}.json`,{cache:"no-store"})).json();
    const entries=entriesOf(ed);
    entries.forEach(e=>{ if(e.theme) state.seenThemes.add(e.theme); });
    const label=(meta.label&&meta.label[state.lang])||meta.date;
    $("#stream").insertAdjacentHTML("beforeend", dayHTML(meta.date,label,entries));
    renderTopics();
    applyFilter();
  }catch(e){ /* fehlende Ausgabe still ueberspringen, das Archiv hat Luecken */ }
  state.loading=false;
  $("#status").textContent = state.queue.length ? "" : t().end;
  syncDate();
  // Falls der Sentinel nach dem Anhaengen noch sichtbar ist, direkt weiterladen
  requestAnimationFrame(maybeLoad);
}

// Datum oben laeuft mit und Nachladen: beides ueber Scroll, nicht ueber
// IntersectionObserver. Der Observer feuerte im Test nicht zuverlaessig,
// obwohl der Sentinel im Viewport stand (geprueft 10.09.2026).
let ticking=false;
let lastY=0;
// Runterscrollen blendet die Themen-Navi aus, das Datum bleibt.
// Hochscrollen holt sie zurueck. Schwelle gegen Zittern.
// Die Navi klappt erst nach einer zusammenhaengenden Strecke in eine Richtung.
// Eine reine Delta-Schwelle reicht nicht: Trackpad-Zittern um den Umschaltpunkt
// liess sie auf- und zuklappen, das war die zweite Flacker-Quelle.
let accum=0;
function syncBar(y){
  const bar=$(".runbar"); if(!bar) return;
  const d=y-lastY;
  lastY=y;
  if(!d) return;
  if((d>0)!==(accum>0)) accum=0;   // Richtungswechsel setzt die Strecke zurueck
  accum+=d;
  if(accum>90 && y>160){ bar.classList.add("compact"); accum=0; }
  else if(accum<-60){ bar.classList.remove("compact"); accum=0; }
}
function onScroll(){
  if(ticking) return;
  ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    syncBar(window.scrollY||document.documentElement.scrollTop||0);
    syncDate();
    maybeLoad();
  });
}
let shownDate=null, toastTimer=null;
const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// Split-Flap. Jede Stelle rollt durch ein paar Zwischenzeichen und rastet ein,
// versetzt gestartet von links nach rechts. Ueber setTimeout, nicht ueber
// requestAnimationFrame, damit es auch in inaktiven Tabs sauber durchlaeuft.
const POOL_ZIFFER="0123456789";
const POOL_BUCHSTABE="ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ";
let flipTimers=[];
function poolFor(c){
  if(/[0-9]/.test(c)) return POOL_ZIFFER;
  if(/[a-zäöüß]/i.test(c)) return POOL_BUCHSTABE;
  return null;                       // Leerzeichen, Punkt, Komma stehen sofort
}
function renderChars(v,text){
  v.innerHTML=[...text].map(c=>`<span class="ch${c===" "?" sp":""}">${esc(c)}</span>`).join("");
}
function setDateText(label){ const v=$("#nowDate .val"); if(v) renderChars(v,label); }
function flipDateText(label){
  const v=$("#nowDate .val"); if(!v) return;
  flipTimers.forEach(clearTimeout); flipTimers=[];
  const alt=[...v.querySelectorAll(".ch")].map(s=>s.textContent);
  renderChars(v,label);
  const felder=[...v.querySelectorAll(".ch")];
  let ende=0;
  felder.forEach((span,i)=>{
    const ziel=label[i], pool=poolFor(ziel);
    if(!pool) return;
    const schritte=3+Math.floor(Math.random()*4);
    const start=i*30, dauer=start+schritte*55;
    if(dauer>ende) ende=dauer;
    let n=0;
    span.textContent = alt[i]!==undefined ? alt[i] : ziel;
    const tick=()=>{
      span.textContent = n<schritte ? pool[Math.floor(Math.random()*pool.length)] : ziel;
      span.classList.remove("roll"); void span.offsetWidth; span.classList.add("roll");
      n++;
      if(n<=schritte) flipTimers.push(setTimeout(tick,55));
    };
    flipTimers.push(setTimeout(tick,start));
    // Eigener Einrast-Zeitgeber je Stelle. Verkettete kurze Timer werden in
    // inaktiven Tabs gedrosselt und brechen ab, dann bliebe Buchstabensalat stehen.
    flipTimers.push(setTimeout(()=>{ span.textContent=ziel; },dauer+40));
  });
  // Letzte Sicherung fuer den ganzen String, ein einzelner langer Zeitgeber
  flipTimers.push(setTimeout(()=>{
    if(v.textContent!==label) renderChars(v,label);
  },ende+220));
}
function flashDate(label){
  const el=$("#nowDate"); if(!el) return;
  const bub=el.querySelector(".bub"), val=el.querySelector(".val");
  el.classList.add("show");

  // Pille kurz pulsen: Klasse abraeumen, Reflow erzwingen, neu setzen,
  // sonst startet die Animation beim zweiten Wechsel nicht neu.
  if(bub && !reduced){ bub.classList.remove("pulse"); void bub.offsetWidth; bub.classList.add("pulse"); }

  // Im Hintergrundtab wird jeder Zeitgeber auf rund eine Sekunde gedrosselt.
  // Das Durchrollen wuerde dort zehn Sekunden brauchen, waehrend der Toast nach
  // 2,4s verschwindet. Dann lieber hart setzen, es schaut ohnehin niemand hin.
  const sichtbar = document.visibilityState === "visible";
  if(!val || reduced || !sichtbar) setDateText(label); else flipDateText(label);

  // Standzeit deckt das Durchrollen ab: letzte Stelle startet nach rund
  // 30ms mal Zeichenzahl, dazu bis zu sechs Rollschritte a 55ms.
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}
function syncDate(){
  const bar=$(".runbar").getBoundingClientRect().bottom;
  let cur=null;
  document.querySelectorAll(".day").forEach(d=>{ if(!d.hidden && d.getBoundingClientRect().top<=bar+8) cur=d; });
  cur=cur||document.querySelector(".day:not([hidden])");
  if(!cur) return;
  const label=cur.dataset.label;
  // Beim ersten Lauf nur merken, nicht zeigen. Der Toast gehoert dem Wechsel.
  if(shownDate===null){ shownDate=label; setDateText(label); return; }
  if(label!==shownDate){ shownDate=label; flashDate(label); }
}
function vh(){ return window.innerHeight || document.documentElement.clientHeight || 800; }
function maybeLoad(){
  const el=$("#sentinel"); if(!el) return;
  if(el.getBoundingClientRect().top < vh() + 700) loadNext();
}
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",onScroll,{passive:true});

// Zweiter, unabhaengiger Ausloeser. Einer der beiden reicht; sie doppeln sich
// absichtlich, weil das Nachladen sonst an einer einzigen API haengt.
try{
  new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) loadNext(); },{rootMargin:"700px"}).observe($("#sentinel"));
}catch(e){}

function closeEntry(art){
  const d=art.querySelector(".detail"); if(!d||d.hidden) return;
  d.hidden=true;
  art.querySelector(".head")?.setAttribute("aria-expanded","false");
  markRead(art);          // gelesen zaehlt beim Schliessen, nicht beim Oeffnen
}
function toggleEntry(art){
  const head=art.querySelector(".head");
  const bl=art.querySelector(".detail");
  if(!bl||!head) return;
  const open=bl.hidden;
  // Immer nur ein Eintrag offen. Beim Oeffnen alle anderen schliessen.
  if(open) document.querySelectorAll(".entry .detail:not([hidden])").forEach(d=>{
    const other=d.closest(".entry");
    if(other!==art) closeEntry(other);
  });
  bl.hidden=!open;
  head.setAttribute("aria-expanded",String(open));
  if(!open) markRead(art);   // zugeklappt heisst gelesen
}
$("#stream").addEventListener("click",ev=>{
  const art=ev.target.closest(".entry"); if(!art) return;
  if(ev.target.closest("a")){ markRead(art); return; }   // Links gewinnen, raus zum Artikel
  // Textauswahl nicht als Klick werten
  const sel=window.getSelection && window.getSelection().toString();
  if(sel && sel.length>2) return;
  ev.preventDefault();
  toggleEntry(art);                                      // der ganze Eintrag schaltet
});
$("#stream").addEventListener("keydown",ev=>{
  if(ev.key!=="Enter" && ev.key!==" ") return;
  const head=ev.target.closest(".head[role=button]"); if(!head) return;
  ev.preventDefault(); toggleEntry(head.closest(".entry"));
});

function moveThumb(animate){
  const box=$("#topics"), th=box.querySelector(".thumb");
  const act=box.querySelector('.chip[aria-pressed="true"]');
  if(!th||!act) return;
  th.classList.toggle("noanim",!animate);
  th.style.width=act.offsetWidth+"px";
  th.style.transform="translateX("+act.offsetLeft+"px)";
  if(!animate) requestAnimationFrame(()=>th.classList.remove("noanim"));
  // aktiven Reiter in Sicht holen, wenn die Spur seitlich scrollt
  if(box.scrollWidth>box.clientWidth){
    const l=act.offsetLeft, r=l+act.offsetWidth;
    if(l<box.scrollLeft) box.scrollTo({left:l-4,behavior:animate?"smooth":"auto"});
    else if(r>box.scrollLeft+box.clientWidth) box.scrollTo({left:r-box.clientWidth+4,behavior:animate?"smooth":"auto"});
  }
}
// Signatur der Reiter. Nur wenn die sich aendert, wird die Schiene neu gebaut.
// Vorher lief bei jedem nachgeladenen Tag ein innerHTML-Neuaufbau, dabei wurde
// die Kachel zerstoert und neu erzeugt: einen Frame auf Breite null, dann
// Sprung an die Position. Das war das Flackern beim Scrollen.
let topicsSig="";
function renderTopics(animate){
  const list=[{id:"all",label:t().all}].concat(THEMES.filter(x=>state.seenThemes.has(x.id)).map(x=>({id:x.id,label:x[state.lang]})));
  const box=$("#topics");
  const sig=state.lang+"|"+list.map(x=>x.id).join(",");

  if(sig!==topicsSig){
    topicsSig=sig;
    const th=box.querySelector(".thumb")||Object.assign(document.createElement("div"),{className:"thumb"});
    box.innerHTML=list.map(x=>`<button class="chip" data-t="${x.id}" aria-pressed="${state.topic===x.id}">${esc(x.label)}</button>`).join("");
    box.insertBefore(th,box.firstChild);   // dieselbe Kachel weiterverwenden
    box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      if(state.topic===b.dataset.t) return;
      state.topic=b.dataset.t; renderTopics(true); applyFilter();
    });
    moveThumb(false);
    requestAnimationFrame(()=>moveThumb(false));
    return;
  }

  // Struktur unveraendert: nur den aktiven Reiter umsetzen und die Kachel fahren
  box.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===state.topic)));
  moveThumb(!!animate);
}
window.addEventListener("resize",()=>moveThumb(false),{passive:true});
function applyFilter(){
  document.querySelectorAll(".entry").forEach(el=>{
    el.hidden = !(state.topic==="all" || el.dataset.theme===state.topic);
  });
  document.querySelectorAll(".day").forEach(d=>{
    d.hidden = ![...d.querySelectorAll(".entry")].some(e=>!e.hidden);
  });
  syncDate(); maybeLoad();
}

function syncLangButtons(){
  $("#langsw").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===state.lang));
  document.documentElement.lang=state.lang;
  $("#footLegal").textContent=t().legal;
}
function resetStream(){
  $(".runbar").classList.remove("compact"); lastY=0; accum=0; shownDate=null; topicsSig="";
  clearTimeout(toastTimer); $("#nowDate").classList.remove("show");
  $("#stream").innerHTML=""; $("#status").textContent="";
  state.queue=state.index.editions.slice();
  state.done=false; state.loading=false; state.seenThemes=new Set();
  renderTopics();
  loadNext();
}
async function boot(){
  // Ausgangslage vom echten Scrollstand nehmen. Bei 0 erzeugt der Browser nach
  // einer wiederhergestellten Scrollposition ein riesiges erstes Delta und die
  // Navi klappt sofort zu.
  lastY=window.scrollY||document.documentElement.scrollTop||0;
  try{
    state.index=await (await fetch("./editions/index.json",{cache:"no-store"})).json();
    state.lang=localStorage.getItem("nr-lang")||state.index.default_lang||"en";
    syncLangButtons();
    resetStream();
  }catch(e){ setDateText(t().loadFail); }
}
$("#langsw").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  if(state.lang===b.dataset.lang) return;
  state.lang=b.dataset.lang; localStorage.setItem("nr-lang",state.lang);
  syncLangButtons(); state.topic="all"; resetStream();
});
boot();

// ---------------------------------------------------------------------------
// Cursor als pulsierender Punkt. Ueber einem klickbaren Element wird er groesser
// und schlaegt schneller. Nur bei echter Maus, Touch bleibt unberuehrt.
// ---------------------------------------------------------------------------
(function(){
  const c=document.getElementById("cursor"); if(!c) return;
  if(!window.matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  // Direkt schreiben statt ueber requestAnimationFrame. Ein Cursor darf keinen
  // Frame nachlaufen, und rAF feuert in versteckten Tabs gar nicht.
  addEventListener("mousemove",e=>{
    c.style.transform="translate3d("+e.clientX+"px,"+e.clientY+"px,0)";
    c.classList.toggle("hot", !!e.target.closest(".entry, a, button, .chip"));
  },{passive:true});
  addEventListener("mouseleave",()=>{ c.style.opacity="0"; });
  addEventListener("mouseenter",()=>{ c.style.opacity="1"; });
})();
</script>
